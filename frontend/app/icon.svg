<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#0A1B4F"/>
    </linearGradient>
    <linearGradient id="t-top-front" x1="4" y1="4" x2="44" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0070F3" />
      <stop offset="100%" stop-color="#0052FF" />
    </linearGradient>
    <linearGradient id="t-stem-front" x1="16" y1="16" x2="32" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0070F3" />
      <stop offset="50%" stop-color="#0052FF" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>
    <linearGradient id="t-fold-shadow" x1="28" y1="10" x2="16" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#003bb5" />
      <stop offset="100%" stop-color="#0B1B4F" />
    </linearGradient>
    <linearGradient id="t-specular" x1="6" y1="4" x2="20" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7DD3FC" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0070F3" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Outer Rounded Squircle with Specular Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#iconBg)" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1.5"/>

  <g transform="translate(8, 8)">
    <!-- Left top wing -->
    <path d="M 6 8 L 24 16 L 24 24 L 6 16 Z" fill="url(#t-top-front)"/>
    <!-- Right top wing -->
    <path d="M 24 16 L 42 8 L 42 16 L 24 24 Z" fill="url(#t-top-front)"/>
    <!-- Top horizontal plate -->
    <path d="M 6 8 L 24 4 L 42 8 L 24 16 Z" fill="#38BDF8"/>
    <!-- Center stem left facet -->
    <path d="M 18 20 L 24 23 L 24 44 L 18 40 Z" fill="url(#t-specular)"/>
    <!-- Center stem right facet -->
    <path d="M 24 23 L 30 20 L 30 40 L 24 44 Z" fill="url(#t-fold-shadow)"/>
    <!-- Center stem front bevel -->
    <path d="M 20 22 L 28 22 L 28 41 L 20 41 Z" fill="url(#t-stem-front)"/>
  </g>
</svg>
