<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E1065"/>
      <stop offset="45%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DDD6FE"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Squircle with Specular Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#C4B5FD" stroke-opacity="0.4" stroke-width="2"/>
  
  <!-- Inner Specular Light Glare -->
  <path d="M4 18 C4 10, 10 4, 18 4 L46 4 C54 4, 60 10, 60 18 L60 22 C40 20, 20 28, 4 38 Z" fill="white" fill-opacity="0.12"/>
  
  <!-- Futuristic Timetable / Calendar Grid Symbol -->
  <g filter="url(#glow)">
    <!-- Calendar Top Bar -->
    <rect x="15" y="16" width="34" height="6" rx="3" fill="url(#glowGrad)"/>
    <!-- Binder Rings -->
    <rect x="22" y="12" width="4" height="6" rx="2" fill="#FFFFFF"/>
    <rect x="38" y="12" width="4" height="6" rx="2" fill="#FFFFFF"/>
    
    <!-- Matrix Cells -->
    <rect x="15" y="26" width="9" height="7" rx="2.5" fill="#FFFFFF" fill-opacity="0.95"/>
    <rect x="27.5" y="26" width="9" height="7" rx="2.5" fill="#C4B5FD" fill-opacity="0.85"/>
    <rect x="40" y="26" width="9" height="7" rx="2.5" fill="#FFFFFF" fill-opacity="0.95"/>
    
    <rect x="15" y="36" width="9" height="7" rx="2.5" fill="#A78BFA" fill-opacity="0.85"/>
    <rect x="27.5" y="36" width="9" height="7" rx="2.5" fill="#FFFFFF" fill-opacity="0.95"/>
    <rect x="40" y="36" width="9" height="7" rx="2.5" fill="#C4B5FD" fill-opacity="0.85"/>
    
    <rect x="15" y="46" width="9" height="7" rx="2.5" fill="#FFFFFF" fill-opacity="0.95"/>
    <rect x="27.5" y="46" width="9" height="7" rx="2.5" fill="#A78BFA" fill-opacity="0.85"/>
    <rect x="40" y="46" width="9" height="7" rx="2.5" fill="#FFFFFF" fill-opacity="0.95"/>
  </g>
</svg>
